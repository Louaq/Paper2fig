# Docker-only overrides. Activate together with the local profile:
#   SPRING_PROFILES_ACTIVE=local,docker
# The local profile supplies the full yudao configuration; this file only
# replaces the host-specific database and Redis endpoints.
spring:
  datasource:
    dynamic:
      datasource:
        master:
          url: "${DB_URL:jdbc:mysql://mysql:3306/yudao?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true}"
          username: "${DB_USERNAME:yudao}"
          password: "${DB_PASSWORD:yudao}"
        slave:
          lazy: true
          url: "${DB_URL:jdbc:mysql://mysql:3306/yudao?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true}"
          username: "${DB_USERNAME:yudao}"
          password: "${DB_PASSWORD:yudao}"
  data:
    redis:
      host: "${REDIS_HOST:redis}"
      port: ${REDIS_PORT:6379}
      database: 0
      password: "${REDIS_PASSWORD:}"
